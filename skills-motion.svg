<text x="30" y="35" font-family="Arial,sans-serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#7dd3fc">TOOLKIT / SELECTED SKILLS</text>
<g transform="translate(28 65)"><rect class="card" width="210" height="132" rx="13"/><circle class="glow" cx="26" cy="34" r="8" fill="#38bdf8"/><text class="n" x="43" y="40">Python + SQL</text><text class="t" x="18" y="74">Query &amp; transform</text><text class="t" x="18" y="98">structured data</text></g>
<g transform="translate(260 65)"><rect class="card" width="210" height="132" rx="13"/><circle class="glow" cx="26" cy="34" r="8" fill="#a78bfa"/><text class="n" x="43" y="40">Pandas + NumPy</text><text class="t" x="18" y="74">Clean, explore &amp;</text><text class="t" x="18" y="98">analyze datasets</text></g>
<g transform="translate(492 65)"><rect class="card" width="210" height="132" rx="13"/><circle class="glow" cx="26" cy="34" r="8" fill="#34d399"/><text class="n" x="43" y="40">Matplotlib</text><text class="t" x="18" y="74">Visualize patterns</text><text class="t" x="18" y="98">and distributions</text></g>
<g transform="translate(724 65)"><rect class="card" width="210" height="132" rx="13"/><circle class="glow" cx="26" cy="34" r="8" fill="#facc15"/><text class="n" x="43" y="40">Power BI + Tableau</text><text class="t" x="18" y="74">Build decision-ready</text><text class="t" x="18" y="98">dashboards</text></g>
<text x="480" y="226" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#85a7c2">From raw data to clear business insights</text>
