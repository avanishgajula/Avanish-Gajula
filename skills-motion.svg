<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 245" role="img" aria-label="Technical toolkit: Python, SQL, Pandas, NumPy, Matplotlib, Power BI, Tableau">
<defs><linearGradient id="sbg" x2="1" y2="1"><stop stop-color="#08192b"/><stop offset="1" stop-color="#102a43"/></linearGradient><style><![CDATA[.card{fill:#10283f;stroke:#315675;stroke-width:1.5}.glow{animation:glow 4s ease-in-out infinite alternate}.scan{animation:scan 8s linear infinite}.n{font-family:Arial,sans-serif;fill:#e2f3ff;font-size:17px;font-weight:bold}.t{font-family:Arial,sans-serif;fill:#8cb3d2;font-size:13px}@keyframes glow{from{opacity:.36}to{opacity:1}}@keyframes scan{from{transform:translateX(-700px)}to{transform:translateX(980px)}}]]></style></defs>
<rect width="960" height="245" rx="18" fill="url(#sbg)"/><path d="M0 78H960M0 160H960" stroke="#21435f" opacity=".55"/>
